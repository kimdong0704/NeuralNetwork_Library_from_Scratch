[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-networks-from-scratch"
version = "2.2.0"
description = "Neural networks built from scratch: feed-forward networks written twice (pure Python and vectorized NumPy), plus NumPy convolution layers and a LeNet-5 forward pass."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# the fundamentals notebooks also use pandas and, for comparison, PyTorch
notebooks = [
    "jupyter",
    "pandas",
    "torch",
    "torchvision",
    "pillow",
    "requests",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["numpy_nn", "numpy_trainer", "numpy_utils", "loop_nn", "loop_trainer", "loop_utils", "mnist", "cnn", "lenet5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
